# Shared compose file for both dev and production Plesk stacks.
#
# Run two separate stacks on the same server:
#   deploy/production/.env  →  Plesk stack "bsk-production"
#   deploy/development/.env →  Plesk stack "bsk-development"
#
# Each stack needs its own .env (ports, secrets, IMAGE_TAG, ROOT_DOMAIN).
# Public URLs are derived from ROOT_DOMAIN + ENV_LABEL in this file.

name: bsk-${STACK_ENV}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '${POSTGRES_HOST_PORT}:5432'

  vendure-server:
    image: ${GHCR_IMAGE_VENDURE}:${IMAGE_TAG}
    restart: unless-stopped
    command: ['node', './dist/index.js']
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: postgres
      DB_PORT: '5432'
      PORT: ${VENDURE_PORT}
      VENDURE_PUBLIC_URL: https://api.${ENV_LABEL}${ROOT_DOMAIN}
      STOREFRONT_URL: https://www.${ENV_LABEL}${ROOT_DOMAIN}
    ports:
      - '${VENDURE_HOST_PORT}:${VENDURE_PORT}'
    volumes:
      - vendure_assets:/app/apps/server/static/assets
    depends_on:
      postgres:
        condition: service_healthy

  vendure-worker:
    image: ${GHCR_IMAGE_VENDURE}:${IMAGE_TAG}
    restart: unless-stopped
    command: ['node', './dist/index-worker.js']
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: postgres
      DB_PORT: '5432'
      VENDURE_PUBLIC_URL: https://api.${ENV_LABEL}${ROOT_DOMAIN}
      STOREFRONT_URL: https://www.${ENV_LABEL}${ROOT_DOMAIN}
    volumes:
      - vendure_assets:/app/apps/server/static/assets
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    image: ${GHCR_IMAGE_STOREFRONT}:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: ${STOREFRONT_PORT}
      HOSTNAME: 0.0.0.0
      VENDURE_SHOP_API_URL: http://vendure-server:${VENDURE_PORT}/shop-api
      NEXT_PUBLIC_SITE_URL: https://www.${ENV_LABEL}${ROOT_DOMAIN}
    ports:
      - '${STOREFRONT_HOST_PORT}:${STOREFRONT_PORT}'
    depends_on:
      - vendure-server

volumes:
  postgres_data:
    name: bsk_${STACK_ENV}_postgres_data
  vendure_assets:
    name: bsk_${STACK_ENV}_vendure_assets
