# Shared compose file for both dev and production Plesk stacks.
#
# Database options (set in each stack's .env):
#   external (default) — use Postgres already running on the Plesk host
#     DB_HOST=host.docker.internal
#   container — bundled Postgres service
#     COMPOSE_PROFILES=container-db
#     DB_HOST=postgres
#
# Run two separate stacks on the same server:
#   deploy/production/.env  →  Plesk stack "bsk-production"
#   deploy/development/.env →  Plesk stack "bsk-development"

name: bsk-${STACK_ENV}

services:
  postgres:
    profiles: [container-db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '${POSTGRES_HOST_PORT}:5432'

  vendure-server:
    image: ${GHCR_IMAGE_VENDURE}:${IMAGE_TAG}
    restart: unless-stopped
    command: ['node', './dist/index.js']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      PORT: ${VENDURE_PORT}
      ASSET_UPLOAD_DIR: /var/lib/vendure/assets
      PRODUCT_FEED_IMPORT_SESSION_DIR: /var/lib/vendure/import-sessions
      VENDURE_PUBLIC_URL: https://api.${ENV_LABEL}${ROOT_DOMAIN}
      STOREFRONT_URL: https://${ENV_LABEL}${ROOT_DOMAIN}
    ports:
      - '${VENDURE_HOST_PORT}:${VENDURE_PORT}'
    volumes:
      - vendure_assets:/var/lib/vendure/assets
      - vendure_import_sessions:/var/lib/vendure/import-sessions

  vendure-worker:
    image: ${GHCR_IMAGE_VENDURE}:${IMAGE_TAG}
    restart: unless-stopped
    command: ['node', './dist/index-worker.js']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      ASSET_UPLOAD_DIR: /var/lib/vendure/assets
      PRODUCT_FEED_IMPORT_SESSION_DIR: /var/lib/vendure/import-sessions
      VENDURE_PUBLIC_URL: https://api.${ENV_LABEL}${ROOT_DOMAIN}
      STOREFRONT_URL: https://${ENV_LABEL}${ROOT_DOMAIN}
    volumes:
      - vendure_assets:/var/lib/vendure/assets
      - vendure_import_sessions:/var/lib/vendure/import-sessions
    # Worker process has no HTTP server; disable the /health check baked into the server image.
    healthcheck:
      disable: true

  storefront:
    image: ${GHCR_IMAGE_STOREFRONT}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: ${STOREFRONT_PORT}
      HOSTNAME: 0.0.0.0
      VENDURE_SHOP_API_URL: http://vendure-server:${VENDURE_PORT}/shop-api
      NEXT_PUBLIC_SITE_URL: https://${ENV_LABEL}${ROOT_DOMAIN}
    ports:
      - '${STOREFRONT_HOST_PORT}:${STOREFRONT_PORT}'
    depends_on:
      - vendure-server

volumes:
  postgres_data:
    name: bsk_${STACK_ENV}_postgres_data
  vendure_assets:
    name: bsk_${STACK_ENV}_vendure_assets
  vendure_import_sessions:
    name: bsk_${STACK_ENV}_vendure_import_sessions
