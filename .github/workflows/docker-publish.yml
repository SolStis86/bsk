name: Publish container images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Image channel to publish (overrides branch default)'
        required: false
        type: choice
        options:
          - auto
          - prod
          - dev

env:
  REGISTRY: ghcr.io

jobs:
  resolve-channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      push: ${{ steps.channel.outputs.push }}
      env_label: ${{ steps.channel.outputs.env_label }}
    steps:
      - name: Resolve image channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            CHANNEL="${{ inputs.environment }}"
          else
            case "${{ github.ref }}" in
              refs/heads/main|refs/tags/v*) CHANNEL="prod" ;;
              refs/heads/develop) CHANNEL="dev" ;;
              *) CHANNEL="none" ;;
            esac
          fi

          if [ "$CHANNEL" = "none" ]; then
            echo "channel=none" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "env_label=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$CHANNEL" = "prod" ]; then
            echo "env_label=" >> "$GITHUB_OUTPUT"
          else
            echo "env_label=dev." >> "$GITHUB_OUTPUT"
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "push=true" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: resolve-channel
    if: needs.resolve-channel.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: vendure
            dockerfile: apps/server/Dockerfile
            image: vendure
          - id: storefront
            dockerfile: apps/storefront/Dockerfile
            image: storefront

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment URLs
        id: deploy
        env:
          PROD_ROOT_DOMAIN: ${{ vars.PROD_ROOT_DOMAIN }}
          DEV_ROOT_DOMAIN: ${{ vars.DEV_ROOT_DOMAIN }}
        run: |
          CHANNEL="${{ needs.resolve-channel.outputs.channel }}"
          ENV_LABEL="${{ needs.resolve-channel.outputs.env_label }}"
          ROOT="$PROD_ROOT_DOMAIN"

          if [ "$CHANNEL" = "dev" ] && [ -n "$DEV_ROOT_DOMAIN" ]; then
            ROOT="$DEV_ROOT_DOMAIN"
            ENV_LABEL=""
          fi

          if [ -z "$ROOT" ]; then
            echo "Configure the PROD_ROOT_DOMAIN repository variable (Settings → Secrets and variables → Actions → Variables)." >&2
            exit 1
          fi

          echo "storefront_url=https://www.${ENV_LABEL}${ROOT}" >> "$GITHUB_OUTPUT"
          echo "asset_host=api.${ENV_LABEL}${ROOT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.resolve-channel.outputs.channel }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.resolve-channel.outputs.channel == 'prod' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CHANNEL=${{ needs.resolve-channel.outputs.channel }}
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ steps.deploy.outputs.storefront_url }}
            VENDURE_ASSET_HOSTNAME=${{ steps.deploy.outputs.asset_host }}
          cache-from: type=gha,scope=${{ matrix.id }}-${{ needs.resolve-channel.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}-${{ needs.resolve-channel.outputs.channel }}
